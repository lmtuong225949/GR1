<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Favicon for most browsers -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/TTHG school.png" />
    
    <!-- Apple Touch Icon (for iOS devices) -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/TTHG school.png" />
    
    <!-- Mask icon for Safari -->
    <link rel="mask-icon" href="%PUBLIC_URL%/TTHG school.png" color="#000000" />
    
    <style>
      img[src*="TTHG school.png"] {
        border-radius: 50%;
        object-fit: cover;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/TTHG school.png" />
    <!--
      manifest.json cung cấp siêu dữ liệu được sử dụng khi ứng dụng web của bạn được cài đặt trên
      thiết bị di động hoặc máy tính để bàn. Xem thêm tại https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Lưu ý việc sử dụng %PUBLIC_URL% trong các thẻ phía trên.
      Nó sẽ được thay thế bằng URL của thư mục `public` trong quá trình build.
      Chỉ các file bên trong thư mục `public` mới có thể được tham chiếu từ HTML.

      Không giống như "/favicon.ico" hoặc "favicon.ico", "%PUBLIC_URL%/favicon.ico" sẽ
      hoạt động chính xác với cả định tuyến phía máy khách và URL công khai không phải gốc.
      Tìm hiểu cách cấu hình URL công khai không phải gốc bằng cách chạy `npm run build`.
    -->
    <title> Quản lý trường THPT</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      Đây là một file HTML mẫu.
      Nếu bạn mở trực tiếp file này trong trình duyệt, bạn sẽ thấy một trang trống.

      Bạn có thể thêm webfonts, meta tags hoặc mã phân tích vào file này.
      Bước build sẽ đặt các script đã được gộp vào thẻ <body>.

      Để bắt đầu phát triển, chạy `npm start` hoặc `yarn start`.
      Để tạo bản build sản phẩm, sử dụng `npm run build` hoặc `yarn build`.
    -->
  </body>
</html>
